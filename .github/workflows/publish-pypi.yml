name: Publish release

# PyPI's trusted publisher for prsr names this file (publish-pypi.yml) and the
# pypi environment; keep both if this workflow is edited.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Validate the tag and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch release references
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git fetch --force origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - name: Validate the release tag
        run: python3 .github/workflows/check_release_tag.py "$GITHUB_REF_NAME"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the source distribution and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Keep the distributions for the publishing jobs
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/prsr/
    permissions:
      id-token: write
    steps:
      - name: Fetch the distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create the GitHub Release
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the release with the distributions attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "prsr ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              --latest
          fi
