name: Checks

on:
  push:
    branches:
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install prsr, CPU PyTorch, and development tools
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . "pytest>=8,<10" "ruff>=0.12,<1"
      - name: Check formatting
        run: ruff format --check src tests .github/workflows
      - name: Check Python style
        run: ruff check src tests .github/workflows
      - name: Run the test suite
        run: pytest -q

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the source distribution and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel and import it
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install dist/*.whl
          cd /tmp && python -c "import prsr, prsr.gcg; print(prsr.__version__, prsr.Parser)"
